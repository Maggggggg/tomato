<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🍅 Tomato Mutations — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090b10;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:18px 16px;
  background:#11151d;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:5;
}

h1{
  font-size:21px;
  margin:0;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  color:#fff;
  background:#272e3b;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.blue{
  background:#285c9d;
}

.good{
  background:#247a49;
}

.warn{
  background:#9b6718;
}

.danger{
  background:#b52d35;
}

.card{
  background:#121722;
  border:1px solid #252c39;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#181e29;
  border-radius:12px;
  padding:15px;
}

.stat b{
  font-size:24px;
  display:block;
  margin-top:5px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.controls input{
  flex:1;
  min-width:200px;
  background:#0d1118;
  color:#fff;
  border:1px solid #303847;
  border-radius:10px;
  padding:11px;
}

.tablewrap{
  overflow:auto;
}

.player{
  min-width:850px;
  width:100%;
  border-collapse:collapse;
}

.player th,
.player td{
  text-align:left;
  padding:11px;
  border-bottom:1px solid #282f3c;
  vertical-align:top;
}

.player th{
  color:#aeb8ca;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.small{
  font-size:12px;
  color:#98a3b7;
}

.success{
  color:#50dd91;
}

.error{
  color:#ff6a72;
}

.loading{
  color:#f4c95d;
}

.login{
  width:min(420px,100%);
  margin:70px auto;
  padding:15px;
}

.login input{
  width:100%;
  margin:7px 0 12px;
  background:#0c1017;
  color:#fff;
  border:1px solid #333c4c;
  border-radius:10px;
  padding:12px;
}

.login button{
  width:100%;
  margin-top:5px;
}

#adminPanel{
  display:none;
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:20;
}

.modal.show{
  display:flex;
}

.modalbox{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:#151b26;
  border:1px solid #303848;
  border-radius:16px;
  padding:18px;
}

.modalbox input,
.modalbox textarea{
  width:100%;
  margin:7px 0 14px;
  background:#0c1017;
  color:#fff;
  border:1px solid #333c4c;
  border-radius:9px;
  padding:11px;
}

.mutationList{
  background:#0d1118;
  border:1px solid #293241;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  max-height:180px;
  overflow:auto;
}

.mutationItem{
  padding:7px;
  border-bottom:1px solid #252c39;
}

.mutationItem:last-child{
  border-bottom:0;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  header{
    align-items:flex-start;
    flex-direction:column;
  }

  .wrap{
    padding:10px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     CONNEXION
===================================================== -->

<div id="loginPanel" class="login">

  <div class="card">

    <h2>🍅 Tomato Mutations</h2>

    <h3>🔐 Connexion Admin</h3>

    <p class="small">
      Connecte-toi avec ton compte administrateur Supabase.
    </p>

    <label>Email</label>

    <input
      id="loginEmail"
      type="email"
      placeholder="Ton adresse email"
      autocomplete="email"
    >

    <label>Mot de passe</label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Ton mot de passe"
      autocomplete="current-password"
    >

    <button
      class="blue"
      id="loginBtn"
    >
      Se connecter
    </button>

    <div
      id="loginStatus"
      class="small"
      style="margin-top:12px"
    ></div>

  </div>

</div>


<!-- =====================================================
     ADMIN
===================================================== -->

<div id="adminPanel">

<header>

  <h1>🍅 Tomato Mutations — ADMIN</h1>

  <div class="controls">

    <span
      id="adminEmail"
      class="small"
    ></span>

    <button id="logout">
      Déconnexion
    </button>

  </div>

</header>


<div class="wrap">

  <div
    id="status"
    class="card"
  >
    <span class="loading">
      Chargement...
    </span>
  </div>


  <div class="stats">

    <div class="stat">
      👥 Joueurs
      <b id="total">0</b>
    </div>

    <div class="stat">
      🍅 Meilleur tomate
      <b id="bestTomato">0</b>
    </div>

    <div class="stat">
      🥕 Meilleur carotte
      <b id="bestCarrot">0</b>
    </div>

  </div>


  <div class="card">

    <div class="controls">

      <input
        id="search"
        placeholder="Rechercher un pseudo..."
      >

      <button
        class="blue"
        id="refresh"
      >
        🔄 Actualiser
      </button>

    </div>

  </div>


  <div class="card">

    <h3>👥 Joueurs</h3>

    <div class="tablewrap">

      <table class="player">

        <thead>

          <tr>
            <th>Joueur</th>
            <th>🍅 Record tomate</th>
            <th>🥕 Record carotte</th>
            <th>🧬 Mutations</th>
            <th>Dernière activité</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="players"></tbody>

      </table>

    </div>

  </div>

</div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  class="modal"
  id="modal"
>

  <div class="modalbox">

    <h2 id="modalTitle">
      Action
    </h2>

    <div id="modalContent"></div>

    <div class="controls">

      <button id="cancel">
        Annuler
      </button>

      <button
        class="blue"
        id="confirm"
      >
        Confirmer
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://rjsrmwtbglhuarmqyfun.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_mSlW81Ge9VrJmFEk-nWGCQ_31yVwxEL";

const {
  createClient
} = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let players = [];

let currentPlayer = null;

let currentAction = null;


/* =========================================================
   HELPERS
========================================================= */

const $ =
  id => document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function money(value){

  return Number(value || 0)
    .toLocaleString("fr-FR");

}


function date(value){

  if(!value)
    return "—";

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return "—";
  }

  return d.toLocaleString(
    "fr-FR"
  );

}


function mutationArray(value){

  if(Array.isArray(value))
    return value;

  if(typeof value === "string"){

    try{

      const parsed =
        JSON.parse(value);

      return Array.isArray(parsed)
        ? parsed
        : [];

    }catch(e){

      return [];

    }

  }

  return [];

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    $("loginEmail")
      .value
      .trim();

  const password =
    $("loginPassword")
      .value;

  if(!email || !password){

    $("loginStatus").innerHTML =
      '<span class="error">' +
      'Entre ton email et ton mot de passe.' +
      '</span>';

    return;

  }

  $("loginBtn").disabled = true;

  $("loginStatus").innerHTML =
    '<span class="loading">' +
    'Connexion...' +
    '</span>';


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    $("loginBtn").disabled = false;

    $("loginStatus").innerHTML =
      '<span class="error">' +
      esc(error.message) +
      '</span>';

    return;

  }


  if(!data.session){

    $("loginBtn").disabled = false;

    $("loginStatus").innerHTML =
      '<span class="error">' +
      'Connexion impossible.' +
      '</span>';

    return;

  }


  $("loginStatus").innerHTML =
    '<span class="success">' +
    'Connexion réussie.' +
    '</span>';


  await startAdmin();

}


$("loginBtn").onclick =
  login;


$("loginPassword").addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      login();

  }
);


/* =========================================================
   VÉRIFICATION ADMIN
========================================================= */

async function startAdmin(){

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();


  if(!session){

    $("loginPanel").style.display =
      "block";

    $("adminPanel").style.display =
      "none";

    return false;

  }


  $("adminEmail").textContent =
    session.user.email ||
    session.user.id;


  $("status").innerHTML =
    '<span class="loading">' +
    'Vérification des droits administrateur...' +
    '</span>';


  const {
    data:isAdmin,
    error
  } =
    await db.rpc(
      "is_admin"
    );


  if(error){

    $("status").innerHTML =
      '<span class="error">' +
      'Erreur de vérification : ' +
      esc(error.message) +
      '</span>';

    return false;

  }


  if(!isAdmin){

    $("status").innerHTML =
      '<span class="error">' +
      '⛔ Ce compte n’est pas administrateur.' +
      '</span>';

    return false;

  }


  $("loginPanel").style.display =
    "none";

  $("adminPanel").style.display =
    "block";


  $("status").innerHTML =
    '<span class="success">' +
    '🛡️ Connecté en tant qu’administrateur.' +
    '</span>';


  await loadPlayers();

  return true;

}


/* =========================================================
   CHARGER LES JOUEURS
========================================================= */

async function loadPlayers(){

  $("status").innerHTML =
    '<span class="loading">' +
    '🔄 Chargement des joueurs...' +
    '</span>';


  const {
    data,
    error
  } =
    await db
      .from("leaderboard")
      .select("*")
      .order(
        "best_tomato",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    $("status").innerHTML =
      '<span class="error">' +
      'Erreur : ' +
      esc(error.message) +
      '</span>';

    return;

  }


  players =
    data || [];


  $("status").innerHTML =
    '<span class="success">' +
    '🛡️ Connecté en tant qu’administrateur.' +
    '</span>';


  render();

}


/* =========================================================
   AFFICHAGE
========================================================= */

function render(){

  const q =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    players.filter(
      p =>
        String(
          p.username || ""
        )
        .toLowerCase()
        .includes(q)
    );


  $("total").textContent =
    players.length;


  const bestTomato =
    players.length
      ? Math.max(
          ...players.map(
            p =>
              Number(
                p.best_tomato || 0
              )
          )
        )
      : 0;


  const bestCarrot =
    players.length
      ? Math.max(
          ...players.map(
            p =>
              Number(
                p.best_carrot || 0
              )
          )
        )
      : 0;


  $("bestTomato").textContent =
    money(bestTomato);


  $("bestCarrot").textContent =
    money(bestCarrot);


  $("players").innerHTML =
    filtered.map(
      p => {

        const tomatoMutations =
          mutationArray(
            p.tomato_mutations
          );


        const carrotMutations =
          mutationArray(
            p.carrot_mutations
          );


        const mutationCount =
          tomatoMutations.length +
          carrotMutations.length;


        return `

          <tr>

            <td>

              <b>
                ${esc(p.username || "Sans pseudo")}
              </b>

            </td>


            <td>

              🍅
              <b>
                ${money(p.best_tomato)}
              </b>

            </td>


            <td>

              🥕
              <b>
                ${money(p.best_carrot)}
              </b>

            </td>


            <td>

              🧬
              ${mutationCount}

            </td>


            <td>

              ${date(p.updated_at)}

            </td>


            <td>

              <div class="actions">

                <button
                  class="warn"
                  onclick="openAction(
                    'tomato',
                    ${JSON.stringify(p.username)}
                  )"
                >
                  🍅 Tomate
                </button>


                <button
                  class="good"
                  onclick="openAction(
                    'carrot',
                    ${JSON.stringify(p.username)}
                  )"
                >
                  🥕 Carotte
                </button>


                <button
                  class="blue"
                  onclick="openAction(
                    'mutations',
                    ${JSON.stringify(p.username)}
                  )"
                >
                  🧬 Mutations
                </button>


                <button
                  class="danger"
                  onclick="openAction(
                    'reset',
                    ${JSON.stringify(p.username)}
                  )"
                >
                  ♻️ Reset
                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =========================================================
   OUVRIR ACTION
========================================================= */

function openAction(
  action,
  username
){

  currentAction =
    action;


  currentPlayer =
    players.find(
      p =>
        p.username === username
    );


  if(!currentPlayer)
    return;


  $("modal")
    .classList
    .add("show");


  if(action === "tomato"){

    $("modalTitle").textContent =
      "🍅 Modifier le record tomate";


    $("modalContent").innerHTML = `

      <p>
        Joueur :
        <b>
          ${esc(currentPlayer.username)}
        </b>
      </p>

      <label>
        Nouveau record
      </label>

      <input
        id="value"
        type="number"
        min="0"
        value="${Number(
          currentPlayer.best_tomato || 0
        )}"
      >

    `;

  }


  else if(action === "carrot"){

    $("modalTitle").textContent =
      "🥕 Modifier le record carotte";


    $("modalContent").innerHTML = `

      <p>
        Joueur :
        <b>
          ${esc(currentPlayer.username)}
        </b>
      </p>

      <label>
        Nouveau record
      </label>

      <input
        id="value"
        type="number"
        min="0"
        value="${Number(
          currentPlayer.best_carrot || 0
        )}"
      >

    `;

  }


  else if(action === "mutations"){

    const mutations =
      mutationArray(
        currentPlayer.tomato_mutations
      );


    $("modalTitle").textContent =
      "🧬 Mutations du joueur";


    $("modalContent").innerHTML = `

      <p>
        <b>
          ${esc(currentPlayer.username)}
        </b>
      </p>

      <p>
        Mutations tomate enregistrées :
        <b>${mutations.length}</b>
      </p>

      <div class="mutationList">

        ${
          mutations.length
          ?
          mutations
            .map(
              m =>
                `<div class="mutationItem">
                  🧬 ${esc(m)}
                </div>`
            )
            .join("")
          :
          `<div class="small">
            Aucune mutation enregistrée.
          </div>`
        }

      </div>

    `;

  }


  else if(action === "reset"){

    $("modalTitle").textContent =
      "♻️ Réinitialiser";


    $("modalContent").innerHTML = `

      <p>
        ⚠️ Tu vas remettre à zéro les
        records de :
      </p>

      <p>
        <b>
          ${esc(currentPlayer.username)}
        </b>
      </p>

      <p class="small">
        Les données du leaderboard seront
        remises à zéro.
      </p>

    `;

  }

}


/* =========================================================
   FERMER MODAL
========================================================= */

function closeModal(){

  $("modal")
    .classList
    .remove("show");

  currentAction =
    null;

  currentPlayer =
    null;

}


/* =========================================================
   CONFIRMER
========================================================= */

async function confirmAction(){

  if(!currentPlayer)
    return;


  const username =
    currentPlayer.username;


  try{

    /* TOMATE */

    if(currentAction === "tomato"){

      const value =
        Math.max(
          0,
          Number(
            $("value").value
          ) || 0
        );


      const {
        error
      } =
        await db
          .from("leaderboard")
          .update({

            best_tomato:
              value,

            updated_at:
              new Date()
                .toISOString()

          })
          .eq(
            "username",
            username
          );


      if(error)
        throw error;

    }


    /* CAROTTE */

    else if(currentAction === "carrot"){

      const value =
        Math.max(
          0,
          Number(
            $("value").value
          ) || 0
        );


      const {
        error
      } =
        await db
          .from("leaderboard")
          .update({

            best_carrot:
              value,

            updated_at:
              new Date()
                .toISOString()

          })
          .eq(
            "username",
            username
          );


      if(error)
        throw error;

    }


    /* RESET */

    else if(currentAction === "reset"){

      const {
        error
      } =
        await db
          .from("leaderboard")
          .update({

            best_tomato:0,

            best_carrot:0,

            tomato_mutations:[],

            carrot_mutations:[],

            updated_at:
              new Date()
                .toISOString()

          })
          .eq(
            "username",
            username
          );


      if(error)
        throw error;

    }


    closeModal();

    await loadPlayers();


  }catch(error){

    console.error(error);

    alert(
      "Erreur : " +
      (error.message || error)
    );

  }

}


/* =========================================================
   BOUTONS
========================================================= */

$("cancel").onclick =
  closeModal;


$("confirm").onclick =
  confirmAction;


$("refresh").onclick =
  loadPlayers;


$("search").oninput =
  render;


/* =========================================================
   LOGOUT
========================================================= */

$("logout").onclick =
  async () => {

    await db.auth.signOut();

    $("adminPanel").style.display =
      "none";

    $("loginPanel").style.display =
      "block";

    $("loginEmail").value =
      "";

    $("loginPassword").value =
      "";

  };


/* =========================================================
   TEMPS RÉEL
========================================================= */

db
  .channel("admin-leaderboard-live")

  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"leaderboard"
    },
    () => {

      loadPlayers();

    }
  )

  .subscribe();


/* =========================================================
   DÉMARRAGE
========================================================= */

(async () => {

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();


  if(session){

    await startAdmin();

  }else{

    $("loginPanel").style.display =
      "block";

    $("adminPanel").style.display =
      "none";

  }

})();

</script>

</body>
</html>
