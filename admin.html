<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🍅 Tomato Mutations — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090b10;
  color:#fff;
  font-family:Arial,sans-serif
}

header{
  padding:18px 16px;
  background:#11151d;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:5
}

h1{
  font-size:21px;
  margin:0
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:16px
}

button,input,select,textarea{
  font:inherit
}

button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  color:#fff;
  background:#272e3b;
  cursor:pointer
}

button:hover{
  filter:brightness(1.15)
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

.danger{background:#b52d35}
.warn{background:#9b6718}
.good{background:#247a49}
.blue{background:#285c9d}

.card{
  background:#121722;
  border:1px solid #252c39;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px
}

.stat{
  background:#181e29;
  border-radius:12px;
  padding:14px
}

.stat b{
  font-size:24px;
  display:block;
  margin-top:5px
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.controls input{
  flex:1;
  min-width:200px;
  background:#0d1118;
  color:#fff;
  border:1px solid #303847;
  border-radius:10px;
  padding:10px
}

.tablewrap{
  overflow:auto
}

.player{
  min-width:1000px;
  width:100%;
  border-collapse:collapse
}

.player th,
.player td{
  text-align:left;
  padding:12px;
  border-bottom:1px solid #282f3c;
  vertical-align:top
}

.player th{
  color:#aeb8ca
}

.online{
  color:#45d889
}

.offline{
  color:#8992a3
}

.banned{
  color:#ff5f67;
  font-weight:bold
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:20
}

.modal.show{
  display:flex
}

.modalbox{
  width:min(500px,100%);
  background:#151b26;
  border:1px solid #303848;
  border-radius:16px;
  padding:18px
}

.modalbox input,
.modalbox textarea,
.modalbox select{
  width:100%;
  margin:6px 0 12px;
  background:#0c1017;
  color:#fff;
  border:1px solid #333c4c;
  border-radius:9px;
  padding:10px
}

.small{
  font-size:12px;
  color:#98a3b7
}

.error{
  color:#ff6a72
}

.success{
  color:#50dd91
}

.loading{
  color:#f4c95d
}

.login{
  width:min(420px,100%);
  margin:70px auto
}

.login h2{
  margin-top:0
}

.login input{
  width:100%;
  margin:7px 0 12px;
  background:#0c1017;
  color:#fff;
  border:1px solid #333c4c;
  border-radius:10px;
  padding:12px
}

.login button{
  width:100%;
  margin-top:5px
}

#adminPanel{
  display:none
}

.empty{
  text-align:center;
  padding:30px;
  color:#9aa4b5
}

.playername{
  font-size:16px;
  font-weight:bold
}

.id{
  word-break:break-all
}

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  header{
    align-items:flex-start;
    flex-direction:column
  }
}
</style>
</head>

<body>

<!-- =====================================================
     CONNEXION
===================================================== -->

<div id="loginPanel" class="login">

  <div class="card">

    <h2>🍅 Tomato Mutations</h2>

    <h3>🔐 Connexion Admin</h3>

    <p class="small">
      Connecte-toi avec ton compte administrateur Supabase.
    </p>

    <label>Email</label>

    <input
      id="loginEmail"
      type="email"
      placeholder="Ton adresse email"
      autocomplete="email"
    >

    <label>Mot de passe</label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Ton mot de passe"
      autocomplete="current-password"
    >

    <button
      class="blue"
      id="loginBtn"
    >
      Se connecter
    </button>

    <div
      id="loginStatus"
      class="small"
      style="margin-top:12px"
    ></div>

  </div>

</div>


<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<div id="adminPanel">

<header>

  <h1>🍅 Tomato Mutations — ADMIN</h1>

  <div class="controls">

    <span
      id="adminEmail"
      class="small"
    ></span>

    <button id="logout">
      Déconnexion
    </button>

  </div>

</header>


<div class="wrap">

  <div
    id="status"
    class="card"
  >
    <span class="loading">
      Chargement...
    </span>
  </div>


  <div class="stats">

    <div class="stat">
      Joueurs
      <b id="total">0</b>
    </div>

    <div class="stat">
      En ligne
      <b id="online">0</b>
    </div>

    <div class="stat">
      Bannis
      <b id="banned">0</b>
    </div>

    <div class="stat">
      Mutations découvertes
      <b id="mutations">0</b>
    </div>

  </div>


  <div class="card">

    <div class="controls">

      <input
        id="search"
        placeholder="🔎 Rechercher un pseudo ou un ID..."
      >

      <button
        class="blue"
        id="refresh"
      >
        🔄 Actualiser
      </button>

      <button
        class="good"
        id="messageBtn"
      >
        📢 Message global
      </button>

    </div>

  </div>


  <div class="card">

    <div class="tablewrap">

      <table class="player">

        <thead>

          <tr>
            <th>Joueur</th>
            <th>Statut</th>
            <th>Argent</th>
            <th>Mutations</th>
            <th>Dernière activité</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="players"></tbody>

      </table>

    </div>

  </div>

</div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  class="modal"
  id="modal"
>

  <div class="modalbox">

    <h2 id="modalTitle">
      Action
    </h2>

    <div id="modalContent"></div>

    <div class="controls">

      <button id="cancel">
        Annuler
      </button>

      <button
        class="blue"
        id="confirm"
      >
        Confirmer
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://rjsrmwtbglhuarmqyfun.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_mSlW81Ge9VrJmFEk-nWGCQ_31yVwxEL";

const {createClient} = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let players = [];

let currentAction = null;

let currentPlayer = null;


/* =========================================================
   HELPERS
========================================================= */

const $ =
  id => document.getElementById(id);


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function money(v){

  return Number(v || 0)
    .toLocaleString("fr-FR");

}


function date(v){

  if(!v)
    return "—";

  const d = new Date(v);

  if(isNaN(d.getTime()))
    return "—";

  return d.toLocaleString("fr-FR");

}


/* =========================================================
   AFFICHER ADMIN
========================================================= */

function showAdmin(){

  $("loginPanel").style.display =
    "none";

  $("adminPanel").style.display =
    "block";

}


/* =========================================================
   CONNEXION
========================================================= */

async function login(){

  const email =
    $("loginEmail")
      .value
      .trim();

  const password =
    $("loginPassword")
      .value;

  if(!email || !password){

    $("loginStatus").innerHTML =
      '<span class="error">' +
      'Entre ton email et ton mot de passe.' +
      '</span>';

    return;

  }


  $("loginBtn").disabled =
    true;

  $("loginStatus").innerHTML =
    '<span class="loading">' +
    'Connexion...' +
    '</span>';


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    $("loginBtn").disabled =
      false;

    $("loginStatus").innerHTML =
      '<span class="error">' +
      esc(error.message) +
      '</span>';

    return;

  }


  if(!data.session){

    $("loginBtn").disabled =
      false;

    $("loginStatus").innerHTML =
      '<span class="error">' +
      'Aucune session reçue.' +
      '</span>';

    return;

  }


  $("loginStatus").innerHTML =
    '<span class="success">' +
    'Connexion réussie ! Chargement du panneau admin...' +
    '</span>';


  showAdmin();


  $("adminEmail").textContent =
    data.user.email ||
    data.user.id;


  await loadPlayers();

}


$("loginBtn").onclick =
  login;


$("loginPassword").addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      login();

  }
);


/* =========================================================
   CHARGER LES JOUEURS
========================================================= */

async function loadPlayers(){

  $("status").innerHTML =
    '<span class="loading">' +
    '🔄 Chargement des joueurs...' +
    '</span>';


  const {
    data,
    error
  } =
    await db
      .from("players")
      .select("*");


  if(error){

    console.error(
      "ERREUR PLAYERS:",
      error
    );

    $("status").innerHTML =
      '<span class="error">' +
      '❌ Impossible de charger les joueurs.<br><br>' +
      esc(error.message) +
      '</span>';

    $("players").innerHTML =
      '<tr><td colspan="6" class="empty">' +
      'Erreur Supabase : ' +
      esc(error.message) +
      '</td></tr>';

    return;

  }


  players =
    data || [];


  $("status").innerHTML =
    '<span class="success">' +
    '🛡️ Connecté en administrateur — ' +
    players.length +
    ' joueur(s) trouvé(s).' +
    '</span>';


  render();

}


/* =========================================================
   AFFICHAGE JOUEURS
========================================================= */

function render(){

  const q =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    players.filter(
      p =>

        String(
          p.username || ""
        )
        .toLowerCase()
        .includes(q)

        ||

        String(
          p.id || ""
        )
        .toLowerCase()
        .includes(q)
    );


  $("total").textContent =
    players.length;


  $("online").textContent =
    players.filter(
      p => p.is_online === true
    ).length;


  $("banned").textContent =
    players.filter(
      p =>
        p.ban_active === true
        ||
        p.banned === true
    ).length;


  $("mutations").textContent =
    players.reduce(
      (total,p) =>
        total +
        Number(
          p.discovered_mutations || 0
        ),
      0
    );


  if(filtered.length === 0){

    $("players").innerHTML =
      '<tr>' +
      '<td colspan="6" class="empty">' +
      (
        players.length === 0
        ?
        "Aucun joueur dans la table players."
        :
        "Aucun joueur ne correspond à la recherche."
      ) +
      '</td>' +
      '</tr>';

    return;

  }


  $("players").innerHTML =
    filtered
      .map(p => {

        const isBanned =
          p.ban_active === true
          ||
          p.banned === true;


        const status =

          isBanned

          ?

          '<span class="banned">' +
          '🔨 BANNI' +
          '</span>'

          :

          p.is_online === true

          ?

          '<span class="online">' +
          '🟢 En ligne' +
          '</span>'

          :

          '<span class="offline">' +
          '⚫ Hors ligne' +
          '</span>';


        return `

          <tr>

            <td>

              <div class="playername">
                ${esc(p.username || "Sans pseudo")}
              </div>

              <div class="small id">
                ID : ${esc(p.id || "—")}
              </div>

            </td>


            <td>
              ${status}
            </td>


            <td>
              💰 ${money(p.money)} $
            </td>


            <td>
              🧬 ${Number(p.discovered_mutations || 0)}
            </td>


            <td>
              ${date(p.last_seen)}
            </td>


            <td>

              <div class="actions">

                <button
                  class="warn"
                  onclick="openAction('money','${esc(String(p.id))}')"
                >
                  💰 Argent
                </button>


                <button
                  class="blue"
                  onclick="openAction('mutations','${esc(String(p.id))}')"
                >
                  🧬 Mutations
                </button>


                <button
                  class="danger"
                  onclick="openAction('kick','${esc(String(p.id))}')"
                >
                  👢 Kick
                </button>


                ${
                  isBanned

                  ?

                  `
                  <button
                    class="good"
                    onclick="openAction('unban','${esc(String(p.id))}')"
                  >
                    🔓 Débannir
                  </button>
                  `

                  :

                  `
                  <button
                    class="danger"
                    onclick="openAction('ban','${esc(String(p.id))}')"
                  >
                    🔨 Ban
                  </button>
                  `
                }


                <button
                  onclick="openAction('reset','${esc(String(p.id))}')"
                >
                  ♻️ Reset
                </button>

              </div>

            </td>

          </tr>

        `;

      })
      .join("");

}


/* =========================================================
   OUVRIR UNE ACTION
========================================================= */

function openAction(
  action,
  id
){

  currentAction =
    action;


  currentPlayer =
    players.find(
      p =>
        String(p.id) === String(id)
    );


  if(!currentPlayer){

    alert(
      "Joueur introuvable."
    );

    return;

  }


  $("modal")
    .classList
    .add("show");


  const titles = {

    money:
      "💰 Modifier l'argent",

    mutations:
      "🧬 Modifier les mutations",

    kick:
      "👢 Expulser le joueur",

    ban:
      "🔨 Bannir le joueur",

    unban:
      "🔓 Débannir le joueur",

    reset:
      "♻️ Réinitialiser le compte"

  };


  $("modalTitle").textContent =
    titles[action];


  if(action === "money"){

    $("modalContent").innerHTML = `

      <label>
        Nouvel argent
      </label>

      <input
        id="actionValue"
        type="number"
        min="0"
        value="${Number(
          currentPlayer.money || 0
        )}"
      >

      <div class="small">
        La valeur actuelle est
        ${money(currentPlayer.money)} $.
      </div>

    `;

  }


  else if(action === "mutations"){

    $("modalContent").innerHTML = `

      <label>
        Nombre de mutations découvertes
      </label>

      <input
        id="actionValue"
        type="number"
        min="0"
        value="${Number(
          currentPlayer.discovered_mutations || 0
        )}"
      >

    `;

  }


  else if(action === "kick"){

    $("modalContent").innerHTML = `

      <p>
        👢 Expulser
        <b>
          ${esc(
            currentPlayer.username ||
            "ce joueur"
          )}
        </b>
        ?
      </p>

      <label>
        Message
      </label>

      <input
        id="actionValue"
        value="Tu as été expulsé par un administrateur."
      >

    `;

  }


  else if(action === "ban"){

    $("modalContent").innerHTML = `

      <label>
        Durée
      </label>

      <select id="duration">

        <option value="3600">
          1 heure
        </option>

        <option value="86400">
          1 jour
        </option>

        <option value="604800">
          7 jours
        </option>

        <option value="2592000">
          30 jours
        </option>

        <option value="0">
          Permanent
        </option>

      </select>


      <label>
        Raison
      </label>

      <textarea id="actionValue">Violation des règles</textarea>

    `;

  }


  else if(action === "unban"){

    $("modalContent").innerHTML = `

      <p>
        🔓 Retirer le bannissement de
        <b>
          ${esc(
            currentPlayer.username ||
            "ce joueur"
          )}
        </b>
        ?
      </p>

    `;

  }


  else if(action === "reset"){

    $("modalContent").innerHTML = `

      <p>
        ⚠️ <b>Attention !</b>
      </p>

      <p>
        Cette action remet à zéro :
      </p>

      <ul>
        <li>💰 Argent</li>
        <li>🧬 Mutations découvertes</li>
        <li>🏆 Record tomate</li>
        <li>🥕 Record carotte</li>
      </ul>

      <p>
        Joueur :
        <b>
          ${esc(
            currentPlayer.username ||
            "ce joueur"
          )}
        </b>
      </p>

    `;

  }

}


/* =========================================================
   FERMER MODAL
========================================================= */

function closeModal(){

  $("modal")
    .classList
    .remove("show");

  currentAction =
    null;

  currentPlayer =
    null;

}


/* =========================================================
   LOG ADMIN
========================================================= */

async function logAdmin(
  action,
  playerId,
  details = {}
){

  const {
    data:{
      user
    }
  } =
    await db.auth.getUser();


  if(!user)
    return;


  const {
    error
  } =
    await db
      .from("admin_logs")
      .insert({

        admin_id:
          user.id,

        player_id:
          playerId,

        action:

          action,

        details:

          details

      });


  if(error){

    console.warn(
      "Log admin impossible :",
      error.message
    );

  }

}


/* =========================================================
   CONFIRMER ACTION
========================================================= */

async function confirmAction(){

  if(!currentPlayer)
    return;


  const p =
    currentPlayer;


  $("confirm").disabled =
    true;


  try{


    /* ==========================================
       ARGENT
    ========================================== */

    if(currentAction === "money"){

      const value =
        Math.max(
          0,
          Number(
            $("actionValue").value
          ) || 0
        );


      const {
        error
      } =
        await db
          .from("players")
          .update({

            money:value

          })
          .eq(
            "id",
            p.id
          );


      if(error)
        throw error;


      await logAdmin(
        "set_money",
        p.id,
        {
          money:value
        }
      );

    }


    /* ==========================================
       MUTATIONS
    ========================================== */

    else if(
      currentAction === "mutations"
    ){

      const value =
        Math.max(
          0,
          Math.floor(
            Number(
              $("actionValue").value
            ) || 0
          )
        );


      const {
        error
      } =
        await db
          .from("players")
          .update({

            discovered_mutations:
              value

          })
          .eq(
            "id",
            p.id
          );


      if(error)
        throw error;


      await logAdmin(
        "set_mutations",
        p.id,
        {
          value:value
        }
      );

    }


    /* ==========================================
       KICK
    ========================================== */

    else if(
      currentAction === "kick"
    ){

      const msg =
        $("actionValue").value ||
        "Expulsé par un administrateur.";


      const {
        error
      } =
        await db
          .from("players")
          .update({

            kick_until:
              new Date(
                Date.now() + 30000
              ).toISOString()

          })
          .eq(
            "id",
            p.id
          );


      if(error)
        throw error;


      await logAdmin(
        "kick",
        p.id,
        {
          message:msg
        }
      );

    }


    /* ==========================================
       BAN
    ========================================== */

    else if(
      currentAction === "ban"
    ){

      const sec =
        Number(
          $("duration").value
        );


      const expires =
        sec > 0

        ?

        new Date(
          Date.now() +
          sec * 1000
        ).toISOString()

        :

        null;


      /*
       * Désactive les anciens bans.
       */

      const oldBan =
        await db
          .from("bans")
          .update({
            active:false
          })
          .eq(
            "player_id",
            p.id
          )
          .eq(
            "active",
            true
          );


      if(oldBan.error)
        throw oldBan.error;


      /*
       * Création du nouveau ban.
       */

      const newBan =
        await db
          .from("bans")
          .insert({

            player_id:
              p.id,

            reason:
              $("actionValue").value ||
              "Aucune raison",

            expires_at:
              expires,

            active:true

          });


      if(newBan.error)
        throw newBan.error;


      /*
       * Déconnecte le joueur.
       */

      const offline =
        await db
          .from("players")
          .update({

            is_online:false

          })
          .eq(
            "id",
            p.id
          );


      if(offline.error)
        throw offline.error;


      await logAdmin(
        "ban",
        p.id,
        {
          expires_at:
            expires
        }
      );

    }


    /* ==========================================
       UNBAN
    ========================================== */

    else if(
      currentAction === "unban"
    ){

      const result =
        await db
          .from("bans")
          .update({

            active:false

          })
          .eq(
            "player_id",
            p.id
          )
          .eq(
            "active",
            true
          );


      if(result.error)
        throw result.error;


      await logAdmin(
        "unban",
        p.id,
        {}
      );

    }


    /* ==========================================
       RESET
    ========================================== */

    else if(
      currentAction === "reset"
    ){

      const result =
        await db
          .from("players")
          .update({

            money:0,

            discovered_mutations:0,

            best_tomato_value:0,

            best_tomato_mutations:[],

            best_carrot_value:0,

            best_carrot_mutations:[]

          })
          .eq(
            "id",
            p.id
          );


      if(result.error)
        throw result.error;


      await logAdmin(
        "reset_account",
        p.id,
        {}
      );

    }


    closeModal();

    await loadPlayers();


  }catch(error){

    console.error(
      "ACTION ADMIN ERROR:",
      error
    );


    alert(
      "❌ Erreur :\n\n" +
      (
        error.message ||
        error
      )
    );


  }finally{

    $("confirm").disabled =
      false;

  }

}


/* =========================================================
   RECHERCHE
========================================================= */

$("search").oninput =
  render;


/* =========================================================
   ACTUALISER
========================================================= */

$("refresh").onclick =
  loadPlayers;


/* =========================================================
   ANNULER
========================================================= */

$("cancel").onclick =
  closeModal;


/* =========================================================
   CONFIRMER
========================================================= */

$("confirm").onclick =
  confirmAction;


/* =========================================================
   LOGOUT
========================================================= */

$("logout").onclick =
  async () => {

    await db.auth.signOut();

    players = [];

    $("adminPanel").style.display =
      "none";

    $("loginPanel").style.display =
      "block";

    $("loginPassword").value =
      "";

    $("loginStatus").innerHTML =
      "";

  };


/* =========================================================
   MESSAGE GLOBAL
========================================================= */

$("messageBtn").onclick =
  async () => {

    const message =
      prompt(
        "📢 Message à envoyer à tous les joueurs :"
      );


    if(!message)
      return;


    const {
      data:{
        user
      }
    } =
      await db.auth.getUser();


    if(!user){

      alert(
        "Session administrateur introuvable."
      );

      return;

    }


    const {
      error
    } =
      await db
        .from("global_messages")
        .insert({

          message:

            message,

          created_by:

            user.id

        });


    if(error){

      alert(
        "❌ Erreur :\n\n" +
        error.message
      );

    }else{

      alert(
        "✅ Message envoyé !"
      );

    }

  };


/* =========================================================
   TEMPS RÉEL
========================================================= */

db
  .channel("admin-live")

  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"players"
    },

    () => {

      loadPlayers();

    }
  )

  .subscribe();


/* =========================================================
   DÉMARRAGE
========================================================= */

(async () => {

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();


  if(session){

    showAdmin();

    $("adminEmail").textContent =
      session.user.email ||
      session.user.id;

    await loadPlayers();

  }

})();

</script>
