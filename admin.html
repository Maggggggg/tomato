<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🍅 Tomato Mutations — ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090b10;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:18px 16px;
  background:#11151d;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:5;
  border-bottom:1px solid #252c39;
}

h1{
  font-size:21px;
  margin:0;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  color:#fff;
  background:#272e3b;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.danger{
  background:#b52d35;
}

.warn{
  background:#9b6718;
}

.good{
  background:#247a49;
}

.blue{
  background:#285c9d;
}

.card{
  background:#121722;
  border:1px solid #252c39;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.stat{
  background:#181e29;
  border-radius:12px;
  padding:13px;
}

.stat b{
  font-size:22px;
  display:block;
  margin-top:5px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.controls input{
  flex:1;
  min-width:180px;
  background:#0d1118;
  color:#fff;
  border:1px solid #303847;
  border-radius:10px;
  padding:10px;
}

.tablewrap{
  overflow:auto;
}

.player{
  min-width:1000px;
  width:100%;
  border-collapse:collapse;
}

.player th,
.player td{
  text-align:left;
  padding:11px;
  border-bottom:1px solid #282f3c;
  vertical-align:top;
}

.player th{
  color:#aeb8ca;
}

.online{
  color:#45d889;
}

.offline{
  color:#8992a3;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.small{
  font-size:12px;
  color:#98a3b7;
}

.error{
  color:#ff6a72;
}

.success{
  color:#50dd91;
}

.loading{
  color:#f4c95d;
}

.login{
  width:min(420px,100%);
  margin:70px auto;
  padding:15px;
}

.login h2{
  margin-top:0;
}

.login input{
  width:100%;
  margin:7px 0 12px;
  background:#0c1017;
  color:#fff;
  border:1px solid #333c4c;
  border-radius:10px;
  padding:12px;
}

.login button{
  width:100%;
  margin-top:5px;
}

#adminPanel{
  display:none;
}

.record{
  max-width:260px;
  word-break:break-word;
  white-space:pre-wrap;
  font-size:12px;
  color:#d8deea;
}

.empty{
  text-align:center;
  padding:25px;
  color:#8992a3;
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:20;
}

.modal.show{
  display:flex;
}

.modalbox{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#151b26;
  border:1px solid #303848;
  border-radius:16px;
  padding:18px;
}

.modalbox input,
.modalbox textarea,
.modalbox select{
  width:100%;
  margin:6px 0 12px;
  background:#0c1017;
  color:#fff;
  border:1px solid #333c4c;
  border-radius:9px;
  padding:10px;
}

.modalbox textarea{
  min-height:120px;
  resize:vertical;
}

.info{
  background:#18202d;
  border:1px solid #303b4d;
  border-radius:10px;
  padding:12px;
  margin:10px 0;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  header{
    align-items:flex-start;
    flex-direction:column;

}
</style>
</head>

<body>

<!-- =====================================================
     CONNEXION
===================================================== -->

<div id="loginPanel" class="login">

<!-- =====================================================

<div id="adminPanel">

<header>

  <h1>

<div class="wrap">

  <div

  >

        id="search"
        placeholder="Rechercher un pseudo ou un ID..."

    </div>

      <table class="player">

        <thead>

          <tr>
            <th>Joueur</th>

            <th>Meilleure carotte</th>

            <th>Actions</th>

      </table>

    </div>

  </div>

</div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  class="modal"
  id="modal"
>

  <div class="modalbox">

    <h2 id="modalTitle">
      Action
    </h2>

    <div id="modalContent"></div>

    <div class="controls">

      <button id="cancel">
        Annuler
      </button>

      <button
        class="blue"
        id="confirm"
      >
        Confirmer
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://rjsrmwtbglhuarmqyfun.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_mSlW81Ge9VrJmFEk-nWGCQ_31yVwxEL";

const {
  createClient
} = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let players = [];

let currentAction = null;

let currentPlayer = null;


/* =========================================================
   HELPERS
========================================================= */

const $ =
  id => document.getElementById(id);


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function date(v){

  if(!v)
    return "—";

  const d = new Date(v);

  if(Number.isNaN(d.getTime()))
    return String(v);

  return d.toLocaleString("fr-FR");

}


function record(v){

  if(v === null || v === undefined)
    return "—";

  if(typeof v === "object"){

    try{
      return JSON.stringify(v,null,2);
    }catch{
      return String(v);
    }

  }

  return String(v);

}


/* =========================================================
   CONNEXION
========================================================= */

async function login(){

  const email =
    $("loginEmail")
      .value
      .trim();

  const password =
    $("loginPassword")
      .value;

  if(!email || !password){

    $("loginStatus").innerHTML =
      '<span class="error">' +
      'Entre ton email et ton mot de passe.' +
      '</span>';

    return;
  }

  $("loginBtn").disabled = true;

  $("loginStatus").innerHTML =
    '<span class="loading">' +
    'Connexion...' +
    '</span>';

  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email,
      password

    });

  if(error){

    $("loginBtn").disabled = false;

    $("loginStatus").innerHTML =
      '<span class="error">' +
      esc(error.message) +
      '</span>';

    return;
  }

  if(!data.session){

    $("loginBtn").disabled = false;

    $("loginStatus").innerHTML =
      '<span class="error">' +
      'Connexion impossible.' +
      '</span>';

    return;
  }

  $("loginStatus").innerHTML =
    '<span class="success">' +
    'Connexion réussie.' +
    '</span>';

  await startAdmin();

  $("loginBtn").disabled = false;

}


$("loginBtn").onclick =
  login;


$("loginPassword").addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      login();

  }
);


/* =========================================================
   VÉRIFICATION ADMIN
========================================================= */

async function startAdmin(){

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();

  if(!session){

    $("loginPanel").style.display =
      "block";

    $("adminPanel").style.display =
      "none";

    return false;
  }


  $("adminEmail").textContent =
    session.user.email ||
    session.user.id;


  $("status").innerHTML =
    '<span class="loading">' +
    'Vérification des droits administrateur...' +
    '</span>';


  const {
    data:isAdmin,
    error
  } =
    await db.rpc("is_admin");


  if(error){

    $("status").innerHTML =
      '<span class="error">' +
      'Erreur lors de la vérification : ' +
      esc(error.message) +
      '</span>';

    return false;
  }


  if(!isAdmin){

    $("status").innerHTML =
      '<span class="error">' +
      '⛔ Ce compte n’est pas administrateur.' +
      '</span>';

    return false;
  }


  $("loginPanel").style.display =
    "none";

  $("adminPanel").style.display =
    "block";


  $("status").innerHTML =
    '<span class="success">' +
    '🛡️ Connecté en administrateur.' +
    '</span>';


  await loadPlayers();

  return true;

}


/* =========================================================
   CHARGEMENT DES JOUEURS
========================================================= */

async function loadPlayers(){

  $("status").innerHTML =
    '<span class="loading">' +
    'Chargement des joueurs...' +
    '</span>';


  /*
    On utilise la fonction SQL admin_get_players()
    créée précédemment.
  */

  const {
    data,
    error
  } =
    await db.rpc(
      "admin_get_players"
    );


  if(error){

    console.error(error);

    $("status").innerHTML =
      '<span class="error">' +
      'Erreur lors du chargement : ' +
      esc(error.message) +
      '</span>';

    $("players").innerHTML =
      '<tr><td colspan="6" class="empty">' +
      'Impossible de charger les joueurs.' +
      '</td></tr>';

    return;
  }


  players =
    Array.isArray(data)
      ? data
      : [];


  players.sort(
    (a,b) =>
      new Date(b.last_seen || b.created_at || 0)
      -
      new Date(a.last_seen || a.created_at || 0)
  );


  $("status").innerHTML =
    '<span class="success">' +
    '🛡️ Connecté en administrateur — ' +
    players.length +
    ' joueur(s).' +
    '</span>';


  render();

}


/* =========================================================
   AFFICHAGE
========================================================= */

function render(){

  const q =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    players.filter(
      p =>

        String(p.username || "")
          .toLowerCase()
          .includes(q)

        ||

        String(p.id || "")
          .toLowerCase()
          .includes(q)
    );


  $("total").textContent =
    players.length;


  $("online").textContent =
    players.filter(
      p => p.is_online === true
    ).length;


  $("kicked").textContent =
    players.filter(
      p =>
        p.kick_until &&
        new Date(p.kick_until) > new Date()
    ).length;


  $("accounts").textContent =
    players.length;


  if(filtered.length === 0){

    $("players").innerHTML =
      '<tr>' +
      '<td colspan="6" class="empty">' +
      (
        players.length === 0
          ? "Aucun joueur dans la table players."
          : "Aucun joueur ne correspond à la recherche."
      ) +
      '</td>' +
      '</tr>';

    return;
  }


  $("players").innerHTML =
    filtered
      .map(p => {

        let status;


        if(
          p.kick_until &&
          new Date(p.kick_until) > new Date()
        ){

          status =
            '<span class="offline">' +
            '👢 Kick actif' +
            '</span>';

        }

        else if(p.is_online){

          status =
            '<span class="online">' +
            '🟢 En ligne' +
            '</span>';

        }

        else{

          status =
            '<span class="offline">' +
            '⚫ Hors ligne' +
            '</span>';

        }


        return `

          <tr>

            <td>

              <b>
                ${esc(p.username || "Sans pseudo")}
              </b>

              <div class="small">
                ${esc(p.id)}
              </div>

              <div class="small">
                Créé le ${date(p.created_at)}
              </div>

            </td>


            <td>
              ${status}
            </td>


            <td>
              <div class="record">
                ${esc(record(p.best_tomato))}
              </div>
            </td>


            <td>
              <div class="record">
                ${esc(record(p.best_carrot))}
              </div>
            </td>


            <td>
              ${date(p.last_seen)}
            </td>


            <td>

              <div class="actions">

                <button
                  class="blue"
                  onclick="openAction(
                    'view',
                    ${JSON.stringify(p.id)}
                  )"
                >
                  👁️ Voir
                </button>


                <button
                  class="warn"
                  onclick="openAction(
                    'tomato',
                    ${JSON.stringify(p.id)}
                  )"
                >
                  🍅 Tomate
                </button>


                <button
                  class="warn"
                  onclick="openAction(
                    'carrot',
                    ${JSON.stringify(p.id)}
                  )"
                >
                  🥕 Carotte
                </button>


                <button
                  class="danger"
                  onclick="openAction(
                    'kick',
                    ${JSON.stringify(p.id)}
                  )"
                >
                  👢 Kick
                </button>


                <button
                  onclick="openAction(
                    'reset',
                    ${JSON.stringify(p.id)}
                  )"
                >
                  ♻️ Reset records
                </button>

              </div>

            </td>

          </tr>

        `;

      })
      .join("");

}


/* =========================================================
   MODAL
========================================================= */

function openAction(
  action,
  id
){

  currentAction =
    action;


  currentPlayer =
    players.find(
      p => p.id === id
    );


  if(!currentPlayer)
    return;


  $("modal")
    .classList
    .add("show");


  const titles = {

    view:
      "👁️ Informations du joueur",

    tomato:
      "🍅 Modifier la meilleure tomate",

    carrot:
      "🥕 Modifier la meilleure carotte",

    kick:
      "👢 Expulser le joueur",

    reset:
      "♻️ Réinitialiser les records"

  };


  $("modalTitle").textContent =
    titles[action];


  /* VOIR */

  if(action === "view"){

    $("modalContent").innerHTML = `

      <div class="info">

        <b>Pseudo</b>

        <div>
          ${esc(currentPlayer.username || "Sans pseudo")}
        </div>

      </div>


      <div class="info">

        <b>User ID</b>

        <div class="small">
          ${esc(currentPlayer.id)}
        </div>

      </div>


      <div class="info">

        <b>Statut</b>

        <div>
          ${
            currentPlayer.is_online
              ? "🟢 En ligne"
              : "⚫ Hors ligne"
          }
        </div>

      </div>


      <div class="info">

        <b>Meilleure tomate</b>

        <pre class="record">${esc(
          record(currentPlayer.best_tomato)
        )}</pre>

      </div>


      <div class="info">

        <b>Meilleure carotte</b>

        <pre class="record">${esc(
          record(currentPlayer.best_carrot)
        )}</pre>

      </div>


      <div class="info">

        <b>Dernière activité</b>

        <div>
          ${date(currentPlayer.last_seen)}
        </div>

      </div>

    `;

  }


  /* TOMATE */

  else if(action === "tomato"){

    $("modalContent").innerHTML = `

      <p>
        Valeur actuelle :
      </p>

      <pre class="record">${esc(
        record(currentPlayer.best_tomato)
      )}</pre>

      <label>
        Nouvelle valeur
      </label>

      <textarea
        id="v"
        placeholder="Entre la nouvelle valeur"
      >${esc(
        typeof currentPlayer.best_tomato === "string"
          ? currentPlayer.best_tomato
          : JSON.stringify(
              currentPlayer.best_tomato ?? ""
            )
      )}</textarea>

      <div class="small">
        Cette colonne existe bien dans ta table players.
      </div>

    `;

  }


  /* CAROTTE */

  else if(action === "carrot"){

    $("modalContent").innerHTML = `

      <p>
        Valeur actuelle :
      </p>

      <pre class="record">${esc(
        record(currentPlayer.best_carrot)
      )}</pre>

      <label>
        Nouvelle valeur
      </label>

      <textarea
        id="v"
        placeholder="Entre la nouvelle valeur"
      >${esc(
        typeof currentPlayer.best_carrot === "string"
          ? currentPlayer.best_carrot
          : JSON.stringify(
              currentPlayer.best_carrot ?? ""
            )
      )}</textarea>

      <div class="small">
        Cette colonne existe bien dans ta table players.
      </div>

    `;

  }


  /* KICK */

  else if(action === "kick"){

    $("modalContent").innerHTML = `

      <p>

        Déconnecter immédiatement :

        <b>
          ${esc(
            currentPlayer.username ||
            "ce joueur"
          )}
        </b>

        ?

      </p>


      <label>
        Durée du kick
      </label>

      <select id="duration">

        <option value="300">
          5 minutes
        </option>

        <option value="1800">
          30 minutes
        </option>

        <option value="3600">
          1 heure
        </option>

      </select>


      <label>
        Message
      </label>

      <input
        id="v"
        value="Tu as été expulsé par un administrateur."
      >

    `;

  }


  /* RESET */

  else if(action === "reset"){

    $("modalContent").innerHTML = `

      <p>

        ⚠️ Réinitialiser les records de :

        <b>
          ${esc(
            currentPlayer.username ||
            "ce joueur"
          )}
        </b>

        ?

      </p>


      <div class="info">

        Cette action remet :

        <br><br>

        🍅 meilleure tomate → vide

        <br>

        🥕 meilleure carotte → vide

      </div>

    `;

  }

}


/* =========================================================
   FERMER MODAL
========================================================= */

function closeModal(){

  $("modal")
    .classList
    .remove("show");

  currentAction =
    null;

  currentPlayer =
    null;

}


/* =========================================================
   CONFIRMATION
========================================================= */

async function confirmAction(){

  if(!currentPlayer)
    return;


  const p =
    currentPlayer;


  try{


    /* TOMATE */

    if(currentAction === "tomato"){

      const value =
        $("v").value;


      const parsed =
        parsePossibleJSON(value);


      const {
        error
      } =
        await db
          .from("players")
          .update({

            best_tomato:
              parsed

          })
          .eq(
            "id",
            p.id
          );


      if(error)
        throw error;

    }


    /* CAROTTE */

    else if(currentAction === "carrot"){

      const value =
        $("v").value;


      const parsed =
        parsePossibleJSON(value);


      const {
        error
      } =
        await db
          .from("players")
          .update({

            best_carrot:
              parsed

          })
          .eq(
            "id",
            p.id
          );


      if(error)
        throw error;

    }


    /* KICK */

    else if(currentAction === "kick"){

      const seconds =
        Number(
          $("duration").value
        );


      const until =
        new Date(
          Date.now() +
          seconds * 1000
        ).toISOString();


      const {
        error
      } =
        await db
          .from("players")
          .update({

            kick_until:
              until

          })
          .eq(
            "id",
            p.id
          );


      if(error)
        throw error;

    }


    /* RESET */

    else if(currentAction === "reset"){

      let result =
        await db
          .from("players")
          .update({

            best_tomato:null,
            best_carrot:null

          })
          .eq(
            "id",
            p.id
          );


      if(result.error)
        throw result.error;

    }


    /* VOIR */

    else if(currentAction === "view"){

      closeModal();

      return;

    }


    closeModal();

    await loadPlayers();


  }catch(e){

    console.error(e);

    alert(
      "Erreur : " +
      (e.message || e)
    );

  }

}


/* =========================================================
   JSON
========================================================= */

function parsePossibleJSON(value){

  const text =
    String(value ?? "").trim();


  if(text === "")
    return null;


  try{

    return JSON.parse(text);

  }catch{

    return text;

  }

}


/* =========================================================
   BOUTONS
========================================================= */

$("cancel").onclick =
  closeModal;


$("confirm").onclick =
  confirmAction;


$("refresh").onclick =
  loadPlayers;


$("search").oninput =
  render;


/* =========================================================
   LOGOUT
========================================================= */

$("logout").onclick =
  async () => {

    await db.auth.signOut();

    $("adminPanel").style.display =
      "none";

    $("loginPanel").style.display =
      "block";

    $("loginPassword").value =
      "";

  };


/* =========================================================
   MESSAGE GLOBAL
========================================================= */

$("messageBtn").onclick =
  async () => {

    const message =
      prompt(
        "Message à envoyer à tous les joueurs :"
      );


    if(!message)
      return;


    const {
      data:{
        user
      }
    } =
      await db.auth.getUser();


    if(!user){

      alert(
        "Session administrateur introuvable."
      );

      return;
    }


    const {
      error
    } =
      await db
        .from("global_messages")
        .insert({

          message,

          created_by:
            user.id

        });


    if(error){

      alert(
        "Erreur : " +
        error.message
      );

    }else{

      alert(
        "📢 Message envoyé."
      );

    }

  };


/* =========================================================
   TEMPS RÉEL
========================================================= */

db
  .channel("admin-live")

  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"players"
    },
    () => {

      loadPlayers();

    }
  )

  .subscribe();


/* =========================================================
   DÉMARRAGE
========================================================= */

(async () => {

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();


  if(session){

    await startAdmin();

  }else{

    $("loginPanel").style.display =
      "block";

    $("adminPanel").style.display =
      "none";

  }

})();

</script>
