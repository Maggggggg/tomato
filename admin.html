<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🍅 Tomato Mutations — ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090b10;
  color:white;
  font-family:Arial,sans-serif
}

header{
  padding:18px 16px;
  background:#11151d;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:5
}

h1{
  font-size:21px;
  margin:0
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:16px
}

button,input,select,textarea{
  font:inherit
}

button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  color:white;
  background:#272e3b;
  cursor:pointer
}

button:hover{
  filter:brightness(1.15)
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

.blue{background:#285c9d}
.good{background:#247a49}
.warn{background:#9b6718}
.danger{background:#b52d35}

.card{
  background:#121722;
  border:1px solid #252c39;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px
}

.login{
  width:min(430px,calc(100% - 30px));
  margin:70px auto
}

.login h2{
  margin-top:0
}

.login input{
  width:100%;
  margin:7px 0 15px;
  padding:12px;
  background:#0c1017;
  color:white;
  border:1px solid #333c4c;
  border-radius:10px
}

.login button{
  width:100%;
  margin-top:5px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px
}

.stat{
  background:#181e29;
  border-radius:12px;
  padding:14px
}

.stat b{
  display:block;
  font-size:24px;
  margin-top:5px
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.controls input{
  flex:1;
  min-width:200px;
  padding:10px;
  background:#0d1118;
  color:white;
  border:1px solid #303847;
  border-radius:10px
}

.tablewrap{
  overflow:auto
}

table{
  width:100%;
  min-width:950px;
  border-collapse:collapse
}

th,td{
  text-align:left;
  padding:11px;
  border-bottom:1px solid #282f3c;
  vertical-align:top
}

th{
  color:#aeb8ca
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px
}

.online{
  color:#45d889
}

.offline{
  color:#8992a3
}

.banned{
  color:#ff5f67;
  font-weight:bold
}

.small{
  font-size:12px;
  color:#98a3b7
}

.success{
  color:#50dd91
}

.error{
  color:#ff6a72
}

.loading{
  color:#f4c95d
}

#adminPanel{
  display:none
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:20
}

.modal.show{
  display:flex
}

.modalbox{
  width:min(500px,100%);
  background:#151b26;
  border:1px solid #303848;
  border-radius:16px;
  padding:18px
}

.modalbox input,
.modalbox textarea,
.modalbox select{
  width:100%;
  margin:7px 0 14px;
  padding:11px;
  background:#0c1017;
  color:white;
  border:1px solid #333c4c;
  border-radius:9px
}

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  header{
    align-items:flex-start;
    flex-direction:column
  }
}
</style>
</head>

<body>

<!-- =========================
     CONNEXION
========================= -->

<div id="loginPanel" class="login">

  <div class="card">

    <h2>🍅 Tomato Mutations</h2>

    <h3>🔐 Administration</h3>

    <p class="small">
      Connecte-toi avec ton compte administrateur Supabase.
    </p>

    <label>Email</label>

    <input
      id="loginEmail"
      type="email"
      placeholder="Adresse email"
      autocomplete="email"
    >

    <label>Mot de passe</label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Mot de passe"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="blue"
    >
      Se connecter
    </button>

    <div
      id="loginStatus"
      style="margin-top:14px"
    ></div>

  </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="adminPanel">

<header>

  <h1>🍅 Tomato Mutations — ADMIN</h1>

  <div class="controls">

    <span id="adminEmail" class="small"></span>

    <button id="logout">
      Déconnexion
    </button>

  </div>

</header>


<div class="wrap">

  <div id="status" class="card">
    <span class="loading">Chargement...</span>
  </div>


  <div class="stats">

    <div class="stat">
      👥 Joueurs
      <b id="total">0</b>
    </div>

    <div class="stat">
      🟢 En ligne
      <b id="online">0</b>
    </div>

    <div class="stat">
      🔨 Bannis
      <b id="banned">0</b>
    </div>

    <div class="stat">
      🧬 Mutations
      <b id="mutations">0</b>
    </div>

  </div>


  <div class="card">

    <div class="controls">

      <input
        id="search"
        placeholder="Rechercher un pseudo ou un ID..."
      >

      <button
        class="blue"
        id="refresh"
      >
        🔄 Actualiser
      </button>

      <button
        class="good"
        id="messageBtn"
      >
        📢 Message global
      </button>

    </div>

  </div>


  <div class="card">

    <div class="tablewrap">

      <table>

        <thead>

          <tr>
            <th>Joueur</th>
            <th>Statut</th>
            <th>Argent</th>
            <th>Mutations</th>
            <th>Dernière activité</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="players">

        </tbody>

      </table>

    </div>

  </div>

</div>

</div>


<!-- =========================
     MODAL
========================= -->

<div
  class="modal"
  id="modal"
>

  <div class="modalbox">

    <h2 id="modalTitle">
      Action
    </h2>

    <div id="modalContent"></div>

    <div class="controls">

      <button id="cancel">
        Annuler
      </button>

      <button
        id="confirm"
        class="blue"
      >
        Confirmer
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://rjsrmwtbglhuarmqyfun.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_mSlW81Ge9VrJmFEk-nWGCQ_31yVwxEL";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let players = [];

let currentPlayer = null;

let currentAction = null;


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
  document.getElementById(id);


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function money(v){

  return Number(v || 0)
    .toLocaleString("fr-FR");

}


function formatDate(v){

  if(!v)
    return "—";

  const d =
    new Date(v);

  if(isNaN(d.getTime()))
    return "—";

  return d.toLocaleString("fr-FR");

}


/* =====================================================
   CONNEXION
===================================================== */

async function login(){

  const email =
    $("loginEmail")
      .value
      .trim();

  const password =
    $("loginPassword")
      .value;

  if(!email || !password){

    $("loginStatus").innerHTML =
      '<span class="error">⚠️ Entre ton email et ton mot de passe.</span>';

    return;
  }

  $("loginBtn").disabled = true;

  $("loginStatus").innerHTML =
    '<span class="loading">🔄 Connexion...</span>';

  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    console.error(error);

    $("loginBtn").disabled = false;

    $("loginStatus").innerHTML =
      '<span class="error">❌ ' +
      esc(error.message) +
      '</span>';

    return;
  }


  if(!data || !data.user){

    $("loginBtn").disabled = false;

    $("loginStatus").innerHTML =
      '<span class="error">❌ Aucun utilisateur connecté.</span>';

    return;
  }


  $("loginStatus").innerHTML =
    '<span class="success">✅ Connexion réussie.</span>';


  await openAdmin();

}


$("loginBtn").onclick =
  login;


$("loginPassword").addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      login();

  }
);


/* =====================================================
   OUVERTURE ADMIN
===================================================== */

async function openAdmin(){

  $("status").innerHTML =
    '<span class="loading">🔄 Vérification du compte...</span>';

  const {
    data:{
      session
    },
    error:sessionError
  } =
    await db.auth.getSession();


  if(sessionError){

    $("loginStatus").innerHTML =
      '<span class="error">❌ Erreur session : ' +
      esc(sessionError.message) +
      '</span>';

    $("loginBtn").disabled = false;

    return;
  }


  if(!session){

    $("loginStatus").innerHTML =
      '<span class="error">❌ Session introuvable.</span>';

    $("loginBtn").disabled = false;

    return;
  }


  $("adminEmail").textContent =
    session.user.email ||
    session.user.id;


  /*
    On vérifie l'administrateur.
  */

  const {
    data:isAdmin,
    error:adminError
  } =
    await db.rpc("is_admin");


  if(adminError){

    console.error(
      "Erreur is_admin:",
      adminError
    );

    $("loginStatus").innerHTML =
      '<span class="error">' +
      '❌ La connexion fonctionne, mais la vérification admin a échoué.<br><br>' +
      esc(adminError.message) +
      '</span>';

    $("loginBtn").disabled = false;

    return;
  }


  if(isAdmin !== true){

    $("loginStatus").innerHTML =
      '<span class="error">' +
      '⛔ Ce compte n’est pas administrateur.' +
      '</span>';

    $("loginBtn").disabled = false;

    return;
  }


  /*
    ADMIN OK
  */

  $("loginPanel").style.display =
    "none";

  $("adminPanel").style.display =
    "block";


  $("status").innerHTML =
    '<span class="success">' +
    '🛡️ Connecté en tant qu’administrateur.' +
    '</span>';


  await loadPlayers();

}


/* =====================================================
   CHARGER LES JOUEURS
===================================================== */

async function loadPlayers(){

  $("status").innerHTML =
    '<span class="loading">🔄 Chargement des joueurs...</span>';


  const {
    data,
    error
  } =
    await db
      .from("players")
      .select("*")
      .order(
        "last_seen",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "Erreur players:",
      error
    );

    $("status").innerHTML =
      '<span class="error">' +
      '❌ Impossible de charger les joueurs.<br><br>' +
      esc(error.message) +
      '</span>';

    return;
  }


  players =
    data || [];


  $("status").innerHTML =
    '<span class="success">' +
    '🛡️ Administrateur connecté — ' +
    players.length +
    ' joueur(s).' +
    '</span>';


  render();

}


/* =====================================================
   AFFICHAGE
===================================================== */

function render(){

  const search =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    players.filter(
      p => {

        const username =
          String(
            p.username || ""
          )
          .toLowerCase();


        const id =
          String(
            p.id || ""
          )
          .toLowerCase();


        return (
          username.includes(search) ||
          id.includes(search)
        );

      }
    );


  $("total").textContent =
    players.length;


  $("online").textContent =
    players.filter(
      p => p.is_online === true
    ).length;


  $("banned").textContent =
    players.filter(
      p => p.ban_active === true
    ).length;


  $("mutations").textContent =
    players.reduce(
      (total,p) =>
        total +
        Number(
          p.discovered_mutations || 0
        ),
      0
    );


  if(filtered.length === 0){

    $("players").innerHTML =
      `<tr>
        <td colspan="6">
          <span class="small">
            Aucun joueur trouvé.
          </span>
        </td>
      </tr>`;

    return;
  }


  $("players").innerHTML =
    filtered
      .map(
        p => {

          let status;


          if(p.ban_active){

            status =
              '<span class="banned">🔨 BANNI</span>';

          }

          else if(p.is_online){

            status =
              '<span class="online">🟢 EN LIGNE</span>';

          }

          else{

            status =
              '<span class="offline">⚫ HORS LIGNE</span>';

          }


          return `

<tr>

<td>

<b>
${esc(p.username || "Sans pseudo")}
</b>

<div class="small">
ID : ${esc(p.id)}
</div>

</td>


<td>
${status}
</td>


<td>
💰 ${money(p.money)} $
</td>


<td>
🧬 ${Number(p.discovered_mutations || 0)}
</td>


<td>
${formatDate(p.last_seen)}
</td>


<td>

<div class="actions">


<button
class="warn"
onclick='openAction("money",${JSON.stringify(p.id)})'
>
💰 Argent
</button>


<button
class="blue"
onclick='openAction("mutations",${JSON.stringify(p.id)})'
>
🧬 Mutations
</button>


<button
class="danger"
onclick='openAction("kick",${JSON.stringify(p.id)})'
>
👢 Kick
</button>


${
p.ban_active

?

`

<button
class="good"
onclick='openAction("unban",${JSON.stringify(p.id)})'
>
🔓 Débannir
</button>

`

:

`

<button
class="danger"
onclick='openAction("ban",${JSON.stringify(p.id)})'
>
🔨 Ban
</button>

`
}


<button
onclick='openAction("reset",${JSON.stringify(p.id)})'
>
♻️ Reset
</button>


</div>

</td>

</tr>

`;

        }
      )
      .join("");

}


/* =====================================================
   MODAL
===================================================== */

function openAction(
  action,
  id
){

  currentAction =
    action;


  currentPlayer =
    players.find(
      p => String(p.id) === String(id)
    );


  if(!currentPlayer)
    return;


  $("modal")
    .classList
    .add("show");


  const titles = {

    money:
      "💰 Modifier l'argent",

    mutations:
      "🧬 Modifier les mutations",

    kick:
      "👢 Expulser le joueur",

    ban:
      "🔨 Bannir le joueur",

    unban:
      "🔓 Débannir le joueur",

    reset:
      "♻️ Réinitialiser le compte"

  };


  $("modalTitle").textContent =
    titles[action];


  if(action === "money"){

    $("modalContent").innerHTML = `

<label>Nouvel argent</label>

<input
id="actionValue"
type="number"
min="0"
value="${Number(currentPlayer.money || 0)}"
>

<div class="small">
La valeur actuelle sera remplacée.
</div>

`;

  }


  else if(action === "mutations"){

    $("modalContent").innerHTML = `

<label>
Nombre de mutations découvertes
</label>

<input
id="actionValue"
type="number"
min="0"
value="${Number(currentPlayer.discovered_mutations || 0)}"
>

`;

  }


  else if(action === "kick"){

    $("modalContent").innerHTML = `

<p>
Expulser <b>
${esc(currentPlayer.username)}
</b> ?
</p>

<label>Message</label>

<input
id="actionValue"
value="Tu as été expulsé par un administrateur."
>

`;

  }


  else if(action === "ban"){

    $("modalContent").innerHTML = `

<label>Durée</label>

<select id="duration">

<option value="3600">
1 heure
</option>

<option value="86400">
1 jour
</option>

<option value="604800">
7 jours
</option>

<option value="2592000">
30 jours
</option>

<option value="0">
Permanent
</option>

</select>


<label>Raison</label>

<textarea id="actionValue">Violation des règles</textarea>

`;

  }


  else if(action === "unban"){

    $("modalContent").innerHTML = `

<p>
Retirer le bannissement de
<b>
${esc(currentPlayer.username)}
</b> ?
</p>

`;

  }


  else if(action === "reset"){

    $("modalContent").innerHTML = `

<p>
⚠️ <b>Attention</b>
</p>

<p>
Cette action remettra à zéro l'argent,
les mutations découvertes et les records de :
</p>

<p>
<b>${esc(currentPlayer.username)}</b>
</p>

`;

  }

}


function closeModal(){

  $("modal")
    .classList
    .remove("show");

  currentAction =
    null;

  currentPlayer =
    null;

}


/* =====================================================
   LOG ADMIN
===================================================== */

async function adminLog(
  action,
  playerId,
  details={}
){

  const {
    data:{
      user
    }
  } =
    await db.auth.getUser();


  if(!user)
    return;


  const {
    error
  } =
    await db
      .from("admin_logs")
      .insert({

        admin_id:user.id,

        player_id:playerId,

        action:action,

        details:details

      });


  if(error)
    console.warn(
      "Log admin impossible:",
      error.message
    );

}


/* =====================================================
   ACTIONS
===================================================== */

async function confirmAction(){

  if(!currentPlayer)
    return;


  const player =
    currentPlayer;


  $("confirm").disabled =
    true;


  try{


    /* ARGENT */

    if(currentAction === "money"){

      const value =
        Math.max(
          0,
          Number(
            $("actionValue").value
          ) || 0
        );


      const {
        error
      } =
        await db
          .from("players")
          .update({
            money:value
          })
          .eq(
            "id",
            player.id
          );


      if(error)
        throw error;


      await adminLog(
        "set_money",
        player.id,
        {
          money:value
        }
      );

    }


    /* MUTATIONS */

    else if(currentAction === "mutations"){

      const value =
        Math.max(
          0,
          Math.floor(
            Number(
              $("actionValue").value
            ) || 0
          )
        );


      const {
        error
      } =
        await db
          .from("players")
          .update({
            discovered_mutations:value
          })
          .eq(
            "id",
            player.id
          );


      if(error)
        throw error;


      await adminLog(
        "set_mutations",
        player.id,
        {
          value:value
        }
      );

    }


    /* KICK */

    else if(currentAction === "kick"){

      const message =
        $("actionValue").value ||
        "Tu as été expulsé par un administrateur.";


      const {
        error
      } =
        await db
          .from("players")
          .update({

            kick_until:
              new Date(
                Date.now()+30000
              ).toISOString()

          })
          .eq(
            "id",
            player.id
          );


      if(error)
        throw error;


      await adminLog(
        "kick",
        player.id,
        {
          message:message
        }
      );

    }


    /* BAN */

    else if(currentAction === "ban"){

      const seconds =
        Number(
          $("duration").value
        );


      const expires =
        seconds === 0
        ? null
        : new Date(
            Date.now() +
            seconds * 1000
          ).toISOString();


      let result;


      result =
        await db
          .from("bans")
          .update({
            active:false
          })
          .eq(
            "player_id",
            player.id
          )
          .eq(
            "active",
            true
          );


      if(result.error)
        throw result.error;


      result =
        await db
          .from("bans")
          .insert({

            player_id:
              player.id,

            reason:
              $("actionValue").value ||
              "Aucune raison",

            expires_at:
              expires,

            active:true

          });


      if(result.error)
        throw result.error;


      result =
        await db
          .from("players")
          .update({
            is_online:false,
            ban_active:true
          })
          .eq(
            "id",
            player.id
          );


      /*
        Si ban_active n'existe pas,
        on ne bloque pas toute l'action.
      */

      if(result.error){

        console.warn(
          "ban_active non modifié:",
          result.error.message
        );

        result =
          await db
            .from("players")
            .update({
              is_online:false
            })
            .eq(
              "id",
              player.id
            );

        if(result.error)
          throw result.error;

      }


      await adminLog(
        "ban",
        player.id,
        {
          expires_at:expires
        }
      );

    }


    /* UNBAN */

    else if(currentAction === "unban"){

      let result =
        await db
          .from("bans")
          .update({
            active:false
          })
          .eq(
            "player_id",
            player.id
          )
          .eq(
            "active",
            true
          );


      if(result.error)
        throw result.error;


      /*
        On essaie aussi de mettre
        ban_active à false.
      */

      result =
        await db
          .from("players")
          .update({
            ban_active:false
          })
          .eq(
            "id",
            player.id
          );


      if(result.error){

        console.warn(
          "ban_active non disponible:",
          result.error.message
        );

      }


      await adminLog(
        "unban",
        player.id,
        {}
      );

    }


    /* RESET */

    else if(currentAction === "reset"){

      const {
        error
      } =
        await db
          .from("players")
          .update({

            money:0,

            discovered_mutations:0,

            best_tomato_value:0,

            best_tomato_mutations:[],

            best_carrot_value:0,

            best_carrot_mutations:[]

          })
          .eq(
            "id",
            player.id
          );


      if(error)
        throw error;


      await adminLog(
        "reset_account",
        player.id,
        {}
      );

    }


    closeModal();

    await loadPlayers();


  }catch(error){

    console.error(error);

    alert(
      "❌ Erreur :\n\n" +
      (error.message || error)
    );

  }


  $("confirm").disabled =
    false;

}


/* =====================================================
   BOUTONS
===================================================== */

$("cancel").onclick =
  closeModal;


$("confirm").onclick =
  confirmAction;


$("refresh").onclick =
  loadPlayers;


$("search").oninput =
  render;


/* =====================================================
   LOGOUT
===================================================== */

$("logout").onclick =
  async () => {

    await db.auth.signOut();

    $("adminPanel").style.display =
      "none";

    $("loginPanel").style.display =
      "block";

    $("loginPassword").value =
      "";

    $("loginStatus").innerHTML =
      "";

  };


/* =====================================================
   MESSAGE GLOBAL
===================================================== */

$("messageBtn").onclick =
  async () => {

    const message =
      prompt(
        "Message à envoyer à tous les joueurs :"
      );


    if(!message)
      return;


    const {
      data:{
        user
      }
    } =
      await db.auth.getUser();


    if(!user){

      alert(
        "Session administrateur introuvable."
      );

      return;
    }


    const {
      error
    } =
      await db
        .from("global_messages")
        .insert({

          message:message,

          created_by:user.id

        });


    if(error){

      alert(
        "❌ " +
        error.message
      );

    }else{

      alert(
        "✅ Message envoyé."
      );

    }

  };


/* =====================================================
   TEMPS RÉEL
===================================================== */

db
  .channel("admin-live")

  .on(
    "postgres_changes",
    {
      event:"*",
      schema:"public",
      table:"players"
    },
    () => {

      loadPlayers();

    }
  )

  .subscribe();


/* =====================================================
   DÉMARRAGE
===================================================== */

(async()=>{

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();


  if(session){

    await openAdmin();

  }

})();

</script>

</body>
</html>
